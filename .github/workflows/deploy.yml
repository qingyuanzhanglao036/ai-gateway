name: Deploy to Cloudflare Workers

on:
  workflow_dispatch: # 允许手动触发
  # push:
  #   branches:
  #     - main

# 部署所需权限
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate wrangler.toml with admin credentials
        run: |
          RAW_USER="${{ vars.ADMIN_USERNAME }}"
          RAW_PASS="${{ vars.ADMIN_PASSWORD }}"
          # 自动清除环境变量可能包含的外层英文/中文引号与首尾空格，确保生成合法的 TOML 配置
          CLEAN_USER=$(echo "$RAW_USER" | sed -e 's/^[ "'\''`]*//' -e 's/[ "'\''`]*$//')
          CLEAN_PASS=$(echo "$RAW_PASS" | sed -e 's/^[ "'\''`]*//' -e 's/[ "'\''`]*$//')
          # 若环境变量为空，回退到默认兜底账号密码
          if [ -z "$CLEAN_USER" ]; then CLEAN_USER="admin"; fi
          if [ -z "$CLEAN_PASS" ]; then CLEAN_PASS="admin123456"; fi

          DEFAULT_URLS=(
            "https://opencode.ai.cmliussss.net/zen/v1"
            "https://opencode.fastly.cmliussss.net/zen/v1"
            "https://opencode.gcore.cmliussss.net/zen/v1"
          )
          MIRRORS_URL=$(IFS=,; echo "${DEFAULT_URLS[*]}")
          EXTRA_URLS="${{ vars.OPENCODE_MIRRORS_URL }}"
          if [ -n "$EXTRA_URLS" ]; then
            CLEAN_EXTRA=$(echo "$EXTRA_URLS" | tr '\n' ',' | sed -e 's/^[ ,]*//' -e 's/[ ,]*$//' -e 's/,,*/,/g')
            if [ -n "$CLEAN_EXTRA" ]; then
              MIRRORS_URL="${MIRRORS_URL},${CLEAN_EXTRA}"
            fi
          fi
          cat > wrangler.toml << EOF
          name = "ai-gateway"
          main = "src/index.ts"
          compatibility_date = "2025-07-01"
          compatibility_flags = ["nodejs_compat"]
          keep_vars = true

          [[kv_namespaces]]
          binding = "KV"

          [vars]
          ADMIN_USERNAME = "${CLEAN_USER}"
          ADMIN_PASSWORD = "${CLEAN_PASS}"
          OPENCODE_MIRRORS_URL = "${MIRRORS_URL}"
          EOF

      - name: Build (dry-run)
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
